<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rad Mobility</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rad Mobility">
<meta name="theme-color" content="#ffe6a8">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    /* sunrise: soft gold into pink */
    --sky: radial-gradient(110% 42% at 50% 108%, rgba(255,160,110,.55), transparent 72%),
           linear-gradient(180deg, #ffe6a8 0%, #ffdcc0 32%, #ffd3c6 62%, #ffc6c0 100%);
    --bg: #fbf3ee; --fg: #2e1a2b; --muted: #9a7a88; --faint: rgba(46,26,43,.07);
    --card: rgba(255,245,238,.15); --line: rgba(196,112,92,.11); --soft: #eaa27e;
    --accent: #e0773a; --accent-fg: #fff; --shadow: rgba(230,120,70,.35);
    /* the icon's sun, used for the main accents in both modes */
    --sunset: linear-gradient(100deg, #ffc76a 0%, #ff9a5c 100%);
    --serif: "Fraunces", Georgia, serif;
    --retro: "Orbitron", -apple-system, sans-serif;
  }
  body.evening {
    /* the icon's night sky, warming to magenta at the horizon */
    --sky: linear-gradient(180deg, #12082e 0%, #1d0b3d 45%, #3a1052 80%, #56145f 100%);
    --bg: #12082e; --fg: #f5ecff; --muted: #a996c6; --faint: rgba(255,255,255,.08);
    --card: rgba(255,255,255,.04); --line: rgba(255,170,240,.12); --soft: #ff5ea8;
    --accent: #ff5ea8; --accent-fg: #fff; --shadow: rgba(255,62,165,.35);
    --sunset: linear-gradient(100deg, #ffb347 0%, #ff5e7e 55%, #ff3ea5 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--sky) fixed, var(--bg);
    color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; min-height: 100dvh;
    transition: color .5s;
    -webkit-font-smoothing: antialiased;
  }
  body > * { position: relative; z-index: 1; }
  /* morning: softer label + arrow on the button so it sits in the sunrise instead of on top of it */
  body:not(.evening) .next { color: #7a5560; }
  /* faint synthwave floor, evening only */
  .horizon {
    position: fixed; z-index: 0; left: 0; right: 0; bottom: 0; height: 38vh; pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent); mask-image: linear-gradient(to top, #000 30%, transparent);
    opacity: 0; transition: opacity .6s;
  }
  .horizon svg { width: 100%; height: 100%; display: block; }
  body.evening .horizon { opacity: .4; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* header */
  header { display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 0 22px; }
  .eyebrow { font-family: var(--retro); font-size: 10.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; margin: 8px 0 0; }
  body.evening h1 { text-shadow: 0 0 28px rgba(255,94,168,.35); }
  .mode {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex-shrink: 0; margin-top: 6px;
  }
  .mode svg { width: 19px; height: 19px; }

  /* video card */
  .player {
    position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: #000;
    box-shadow: 0 20px 44px -18px var(--shadow), 0 2px 6px rgba(0,0,0,.08);
  }
  body.evening .player { box-shadow: 0 20px 54px -16px var(--shadow), 0 0 0 1px var(--line); }
  .player iframe, #yt { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* The poster sits on top but lets taps fall through to YouTube's player, so iOS plays it natively. */
  .poster { position: absolute; inset: 0; pointer-events: none; transition: opacity .35s; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.45)); }
  .poster .play {
    position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px; border-radius: 50%;
    background: rgba(255,255,255,.88); display: grid; place-items: center; z-index: 1;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .poster .play svg { width: 26px; height: 26px; margin-left: 4px; fill: #2b2620; }
  .poster .len {
    position: absolute; right: 12px; bottom: 12px; z-index: 1; font-size: 12px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,.45); padding: 4px 9px; border-radius: 999px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .poster.hidden { opacity: 0; }
  .player.swap { animation: swap .45s ease; }
  @keyframes swap { 0% { opacity: .2; transform: scale(.97); } 100% { opacity: 1; transform: none; } }

  /* meta */
  .meta { padding: 18px 2px 0; }
  .channel { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .title { font-family: var(--serif); font-size: 23px; line-height: 1.2; letter-spacing: -0.01em; margin-top: 5px; }
  .links { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .links .open { color: var(--muted); padding: 4px 0; margin-left: auto; }
  .links .open:active { color: var(--fg); }
  .thumb {
    width: 44px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--muted); transition: transform .15s, background .2s, color .2s;
  }
  .thumb svg { width: 19px; height: 19px; }
  .thumb:active { transform: scale(.92); }
  .thumb.on { background: var(--sunset); border-color: transparent; color: var(--accent-fg); }
  .thumb.on svg path { fill: currentColor; }

  /* week */
  .week {
    margin-top: auto; padding: 16px 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .week-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .week-head .label { font-family: var(--retro); color: var(--muted); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: 10px; }
  .week-head .streak { color: var(--fg); font-weight: 500; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; text-align: center; }
  .day { font-size: 11px; color: var(--muted); }
  .dot {
    width: 30px; height: 30px; margin: 6px auto 0; border-radius: 50%; background: var(--faint);
    display: grid; place-items: center; transition: background .4s, transform .4s;
  }
  .dot svg { width: 14px; height: 14px; stroke: var(--accent-fg); opacity: 0; }
  .day.today .dot { box-shadow: inset 0 0 0 1.5px var(--soft); }
  .day.today { color: var(--fg); font-weight: 600; }
  .day.done .dot { background: var(--sunset); box-shadow: 0 4px 12px -4px var(--shadow); }
  .day.done .dot svg { opacity: 1; }
  .day.pop .dot { animation: pop .6s ease; }
  @keyframes pop { 40% { transform: scale(1.25); } }

  .spacer { min-height: 20px; flex: 0 0 20px; }
  /* YouTube-app mode: a real link over the card, so iOS hands it to the YouTube app */
  .applink { position: absolute; inset: 0; z-index: 2; display: none; }
  body.app-mode .applink { display: block; }
  .links .open { text-decoration: none; }

  /* "Finished?" check-in after coming back from the YouTube app */
  .finish {
    display: none; margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); align-items: center; gap: 12px;
  }
  .finish.show { display: flex; animation: swap .4s ease; }
  .finish .q { flex: 1; font-size: 15px; line-height: 1.3; }
  .finish .q small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .finish button { font-size: 14px; font-weight: 500; padding: 9px 12px; border-radius: 12px; color: var(--muted); }
  .finish .yes { background: var(--soft); color: #fff; }

  /* settings row */
  .pref { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .switch { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--faint); border: 1px solid var(--line); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .switch:checked { background: var(--soft); border-color: transparent; }
  .switch:checked::after { transform: translateX(16px); }
  .next {
    width: 100%; height: 54px; border-radius: 18px; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-weight: 500; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 12px; transition: transform .12s;
  }
  .next:active, .mode:active { transform: scale(.97); }
  .next svg { width: 18px; height: 18px; color: var(--soft); }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 14px); transform: translate(-50%, -8px);
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap;
    display: flex; align-items: center; gap: 12px;
  }
  .toast.show.has-undo { pointer-events: auto; }
  .toast button { font-weight: 700; color: #d6337f; }
  body:not(.evening) .toast button { color: #ffc76a; }
  .toast.show { opacity: .95; transform: translate(-50%, 0); }
  .confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
  @media (min-width: 600px) { body { max-width: 520px; margin: 0 auto; } }
</style>
</head>

"100" vector-effect="non-scaling-stroke"/><line x1="58.10" y1="0" x2="194.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="59.00" y1="0" x2="210.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="59.90" y1="0" x2="226.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="60.80" y1="0" x2="242.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="61.70" y1="0" x2="258.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="62.60" y1="0" x2="274.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="-50" y1="0.00" x2="150" y2="0.00" vector-effect="non-scaling-stroke"/><line x1="-50" y1="1.92" x2="150" y2="1.92" vector-effect="non-scaling-stroke"/><line x1="-50" y1="7.18" x2="150" y2="7.18" vector-effect="non-scaling-stroke"/><line x1="-50" y1="15.51" x2="150" y2="15.51" vector-effect="non-scaling-stroke"/><line x1="-50" y1="26.79" x2="150" y2="26.79" vector-effect="non-scaling-stroke"/><line x1="-50" y1="40.94" x2="150" y2="40.94" vector-effect="non-scaling-stroke"/><line x1="-50" y1="57.89" x2="150" y2="57.89" vector-effect="non-scaling-stroke"/><line x1="-50" y1="77.59" x2="150" y2="77.59" vector-effect="non-scaling-stroke"/><line x1="-50" y1="100.00" x2="150" y2="100.00" vector-effect="non-scaling-stroke"/></g></svg></div>
  <header>
    <div>
      <div class="eyebrow" id="date"></div>
      <h1 id="greeting">Good morning</h1>
    </div>
    <button class="mode" id="mode" aria-label="Switch morning / evening"></button>
  </header>

  <div class="player" id="card">
    <div id="yt"></div>
    <div class="poster" id="poster">
      <img id="thumb" alt="">
      <div class="play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></div>
      <div class="len" id="len"></div>
    </div>
    <a class="applink" id="applink" href="#" aria-label="Play in the YouTube app"></a>
  </div>

  <div class="meta">
    <div class="channel" id="channel"></div>
    <div class="title" id="title">Loading…</div>
    <div class="links">
      <button class="thumb" id="up" aria-label="Thumbs up — show this more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 10.5V20H4.5a1 1 0 0 1-1-1v-7.5a1 1 0 0 1 1-1H7zm0 0l3.6-6.3a1.6 1.6 0 0 1 2.9 1.1L12.8 9h5.6a2 2 0 0 1 2 2.4l-1.4 6.8a2.2 2.2 0 0 1-2.2 1.8H7"/></svg></button>
      <button class="thumb" id="down" aria-label="Thumbs down — don't show again"><svg style="transform:rotate(180deg)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 10.5V20H4.5a1 1 0 0 1-1-1v-7.5a1 1 0 0 1 1-1H7zm0 0l3.6-6.3a1.6 1.6 0 0 1 2.9 1.1L12.8 9h5.6a2 2 0 0 1 2 2.4l-1.4 6.8a2.2 2.2 0 0 1-2.2 1.8H7"/></svg></button>
      <a class="open" id="open" href="#">Open in YouTube ↗</a>
    </div>
  </div>

  <div class="finish" id="finish">
    <div class="q">Finished your stretch?<small id="finish-title"></small></div>
    <button id="finish-no">Not yet</button>
    <button class="yes" id="finish-yes">Yes ✓</button>
  </div>

  <div class="spacer"></div>

    <div class="week-head"><span class="label">This week</span><span class="streak" id="streak"></span></div>

<script src="videos.js"></script>
<script>
  // ---- storage (safe if localStorage is unavailable) ----
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const blocked = new Set(store.get("blocked", []));   // thumbs down + unembeddable
  const liked = new Set(store.get("liked", []));       // thumbs up
  const lastShown = store.get("lastShown", {});         // id -> timestamp
  const current = store.get("current", {});            // mode -> {id, at}
  const doneDays = new Set(store.get("doneDays", []));  // "YYYY-MM-DD" days you finished a routine
  let appMode = store.get("appMode", false);             // play in the YouTube app (ad-free with Premium)

  const autoMode = () => { const h = new Date().getHours(); return (h >= 18 || h < 4) ? "evening" : "morning"; };
  let mode = autoMode();
  let lastAuto = mode;   // a manual switch sticks until the clock crosses 6pm / 4am
  let video = null, player = null, ready = false, progressTimer = null;
  let reached = false, celebrated = false;   // this video: past 80% / confetti already popped

  const $ = (id) => document.getElementById(id);
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  function applyMode() {
    document.body.classList.toggle("evening", mode === "evening");
    const h = new Date().getHours();
    $("greeting").textContent = mode === "evening" ? "Wind down" : h >= 18 || h < 4 ? "Good evening" : h >= 12 ? "Good afternoon" : "Good morning";
    $("mode").innerHTML = mode === "evening" ? SUN : MOON;
    $("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    document.querySelector('meta[name="theme-color"]').content = mode === "evening" ? "#12082e" : "#ffe6a8";
  }

  // ---- week strip + streak ----
  function renderWeek(popToday) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    $("days").innerHTML = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const k = dayKey(d), isToday = k === dayKey(today);
      const el = document.createElement("div");
      el.className = "day" + (doneDays.has(k) ? " done" : "") + (isToday ? " today" : "") + (isToday && popToday ? " pop" : "");
      el.innerHTML = `${"MTWTFSS"[i]}<div class="dot">${CHECK}</div>`;
      $("days").appendChild(el);
    }
    let streak = 0; const d = new Date(today);
    if (!doneDays.has(dayKey(d))) d.setDate(d.getDate() - 1);   // today not done yet doesn't break the streak
    while (doneDays.has(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
    $("streak").textContent = streak > 1 ? `${streak}-day streak` : doneDays.has(dayKey(today)) ? "Done today ✓" : "";
  }

  function saveToday() {
    const k = dayKey(new Date());
    if (doneDays.has(k)) return;
    doneDays.add(k); store.set("doneDays", [...doneDays]); renderWeek();
  }

  // A video was completed: count the day and celebrate, once per video.
  function markDone() {
    saveToday();
    if (celebrated) return;
    celebrated = true;
    renderWeek(true); confetti();
    toast(mode === "evening" ? "Nicely done. Sleep well." : "Nice work. Have a good day.");
  }

  // ---- confetti, in the icon's sunrise / synthwave colors ----
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = mode === "evening" ? ["#ffb347", "#ff5e7e", "#ff3ea5", "#b58cff", "#f5ecff"]
                                      : ["#ffc76a", "#ff9a5c", "#e0773a", "#ff8fa3", "#fff4d6"];
    const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    const ctx = c.getContext("2d"); ctx.scale(dpr, dpr);
    // two bursts from the lower corners, angled up toward the middle
    const bits = Array.from({ length: 140 }, (_, i) => {
      const left = i % 2 === 0, a = (left ? -60 : -120) + (Math.random() - 0.5) * 50, sp = 9 + Math.random() * 9;
      return { x: left ? 0 : W, y: H * 0.8, vx: Math.cos(a * Math.PI / 180) * sp, vy: Math.sin(a * Math.PI / 180) * sp,
               w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
               color: colors[i % colors.length], round: Math.random() < 0.3 };
    });
    const start = performance.now();
    (function frame(now) {
      const t = now - start;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = Math.max(0, Math.min(1, (3200 - t) / 800));   // fade out over the last 0.8s
      for (const b of bits) {
        b.vx *= 0.985; b.vy = b.vy * 0.985 + 0.28; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.color;
        ctx.scale(1, Math.cos(t / 120 + b.r));   // flutter
        if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.h / 2 + 1, 0, 7); ctx.fill(); } else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      if (t < 3200) requestAnimationFrame(frame); else c.remove();
    })(start);
  }

  // Least-recently-shown first, random among ties, so you cycle the whole list before repeats.
  // Thumbs-up videos jump the queue ~40% of the time once they haven't been shown for 3 days.
  function pick(excludeId) {
    const pool = VIDEOS[mode].filter(v => !blocked.has(v[0]) && v[0] !== excludeId);
    if (!pool.length) return null;
    const fav = pool.filter(v => liked.has(v[0]) && Date.now() - (lastShown[v[0]] || 0) > 3 * 864e5);
    if (fav.length && Math.random() < 0.4) return fav[Math.floor(Math.random() * fav.length)];
    pool.sort(() => Math.random() - 0.5);
    pool.sort((a, b) => (lastShown[a[0]] || 0) - (lastShown[b[0]] || 0));
    return pool[0];
  }

  function show(v, animate) {
    video = v; reached = celebrated = false;
    if (!v) {
      $("channel").textContent = ""; $("title").textContent = "You've thumbed-down everything here.";
      toast("Bring them all back?", () => { VIDEOS[mode].forEach(x => blocked.delete(x[0])); store.set("blocked", [...blocked]); show(pick(), true); }, "Restore");
      return;
    }
    lastShown[v[0]] = Date.now(); store.set("lastShown", lastShown);
    current[mode] = { id: v[0], at: Date.now() }; store.set("current", current);
    $("channel").textContent = v[2];
    $("up").classList.toggle("on", liked.has(v[0]));
    $("title").textContent = v[1];
    $("len").textContent = v[3];
    $("applink").href = $("open").href = `https://www.youtube.com/watch?v=${v[0]}`;
    const img = $("thumb");
    img.onerror = () => { img.onerror = null; img.src = `https://i.ytimg.com/vi/${v[0]}/hqdefault.jpg`; };
    img.src = `https://i.ytimg.com/vi/${v[0]}/maxresdefault.jpg`;
    $("poster").classList.remove("hidden");
    if (animate) { const c = $("card"); c.classList.remove("swap"); void c.offsetWidth; c.classList.add("swap"); }
    if (ready) player.cueVideoById(v[0]);
  }

  function initial() {
    // Reopening within 2 hours keeps the same video instead of jumping to a new one.
    const c = current[mode];
    if (c && Date.now() - c.at < 2 * 3600e3 && !blocked.has(c.id)) {
      const v = VIDEOS[mode].find(x => x[0] === c.id);
      if (v) return v;
    }
    return pick();
  }

  function next() { show(pick(video && video[0]), true); }

  let toastTimer;
  function toast(msg, undo, label = "Undo") {
    const t = $("toast"); t.textContent = msg; t.classList.toggle("has-undo", !!undo);
    if (undo) { const b = document.createElement("button"); b.textContent = label; b.onclick = () => { t.classList.remove("show"); undo(); }; t.appendChild(b); }
    t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), undo ? 4000 : 2200);
  }

  $("next").onclick = next;
  $("up").onclick = () => {
    if (!video) return;
    const id = video[0];
    if (liked.has(id)) liked.delete(id); else { liked.add(id); toast("Saved. You'll see this one more often."); }
    store.set("liked", [...liked]); $("up").classList.toggle("on", liked.has(id));
  };
  $("down").onclick = () => {
    if (!video) return;
    const v = video;
    blocked.add(v[0]); liked.delete(v[0]); store.set("blocked", [...blocked]); store.set("liked", [...liked]);
    next();
    toast("Removed from your queue", () => { blocked.delete(v[0]); store.set("blocked", [...blocked]); show(v, true); });
  };
  // Leaving for the YouTube app: remember what was playing so we can ask "Finished?" on return.
  const handoff = () => { if (video) store.set("pending", { id: video[0], title: video[1], at: Date.now() }); };
  $("applink").addEventListener("click", handoff);
  $("open").addEventListener("click", handoff);

  function checkFinished() {
    const p = store.get("pending", null);
    if (!p || Date.now() - p.at < 30e3 || Date.now() - p.at > 6 * 3600e3) {
      if (p && Date.now() - p.at > 6 * 3600e3) store.set("pending", null);
      return;
    }
    $("finish-title").textContent = p.title;
    $("finish").classList.add("show");
  }
  const closeFinish = () => { $("finish").classList.remove("show"); store.set("pending", null); };
  $("finish-yes").onclick = () => { closeFinish(); celebrated = false; markDone(); next(); };   // line up a fresh one for next time
  $("finish-no").onclick = closeFinish;

  $("appmode").checked = appMode;
  document.body.classList.toggle("app-mode", appMode);
  $("appmode").onchange = (e) => {
    appMode = e.target.checked; store.set("appMode", appMode);
    document.body.classList.toggle("app-mode", appMode);
    toast(appMode ? "Videos will open in the YouTube app" : "Videos will play here");
  };
  $("mode").onclick = () => { mode = mode === "evening" ? "morning" : "evening"; applyMode(); show(initial(), true); };


  // When the app comes back from the background and the time of day has flipped, follow it.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    renderWeek(); applyMode();   // refresh date + morning/afternoon greeting
    checkFinished();
    if (autoMode() === lastAuto) return;
    mode = lastAuto = autoMode(); applyMode(); show(initial(), true);
  });

  applyMode();
  renderWeek();
  show(initial());
  checkFinished();   // the app may have been fully closed while you were in YouTube

  // ---- YouTube player ----
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("yt", {
      videoId: video ? video[0] : undefined,
      playerVars: { playsinline: 0, rel: 0, modestbranding: 1, fs: 1 },
      events: {
        onReady: () => { ready = true; },
        onStateChange: (e) => {
          const S = YT.PlayerState;
          if (e.data === S.PLAYING || e.data === S.BUFFERING) $("poster").classList.add("hidden");
          // Finishing, or stopping after ~80%, counts as complete. The confetti waits until then
          // so it isn't hidden behind the full-screen player mid-routine.
          if (e.data === S.ENDED || (e.data === S.PAUSED && reached)) markDone();
          clearInterval(progressTimer);
          if (e.data === S.PLAYING) progressTimer = setInterval(() => {
            const dur = player.getDuration();
            if (dur && player.getCurrentTime() / dur >= 0.8) { reached = true; saveToday(); clearInterval(progressTimer); }
          }, 3000);
        },
        // 100 = removed, 101/150 = owner disabled embedding. Hide it and move on.
        onError: (e) => { if ([100, 101, 150].includes(e.data) && video) { blocked.add(video[0]); store.set("blocked", [...blocked]); next(); } },
      },
    });
  };
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
