<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rad Mobility</title>
<!-- Add 0.1 with every change merged to main (2.9 is followed by 3.0); shown at the bottom of the app and used by the update notice. -->
<meta name="version" content="2.3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rad Mobility">
<meta name="theme-color" content="#ffe6a8">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    /* sunrise: soft gold into pink */
    --sky: radial-gradient(110% 42% at 50% 108%, rgba(255,160,110,.55), transparent 72%),
           linear-gradient(180deg, #ffe6a8 0%, #ffdcc0 32%, #ffd3c6 62%, #ffc6c0 100%);
    --bg: #fbf3ee; --fg: #2e1a2b; --muted: #9a7a88; --faint: rgba(46,26,43,.07);
    --card: rgba(255,245,238,.15); --line: rgba(196,112,92,.11); --soft: #eaa27e;
    --accent: #e0773a; --accent-fg: #fff; --shadow: rgba(230,120,70,.35);
    /* the icon's sun, used for the main accents in both modes */
    --sunset: linear-gradient(100deg, #ffc76a 0%, #ff9a5c 100%);
    /* week dots: which routine you did that day, the same in both modes */
    --am: linear-gradient(135deg, #ffc76a, #ff9a5c);
    --pm: linear-gradient(135deg, #b05cff, #ff3ea5);
    --ampm: linear-gradient(135deg, #ffc76a 0%, #ff9a5c 49%, #b05cff 51%, #ff3ea5 100%);
    --serif: "Fraunces", Georgia, serif;
    --retro: "Orbitron", -apple-system, sans-serif;
  }
  body.evening {
    /* the icon's night sky, warming to magenta at the horizon */
    --sky: linear-gradient(180deg, #12082e 0%, #1d0b3d 45%, #3a1052 80%, #56145f 100%);
    --bg: #12082e; --fg: #f5ecff; --muted: #a996c6; --faint: rgba(255,255,255,.08);
    --card: rgba(255,255,255,.04); --line: rgba(255,170,240,.12); --soft: #ff5ea8;
    --accent: #ff5ea8; --accent-fg: #fff; --shadow: rgba(255,62,165,.35);
    --sunset: linear-gradient(100deg, #ffb347 0%, #ff5e7e 55%, #ff3ea5 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--sky) fixed, var(--bg);
    color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; min-height: 100dvh;
    transition: color .5s;
    -webkit-font-smoothing: antialiased;
  }
  body > * { position: relative; z-index: 1; }
  /* morning: softer label + arrow on the button so it sits in the sunrise instead of on top of it */
  body:not(.evening) .next { color: #7a5560; }
  /* faint synthwave floor, evening only */
  .horizon {
    position: fixed; z-index: 0; left: 0; right: 0; bottom: 0; height: 38vh; pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent); mask-image: linear-gradient(to top, #000 30%, transparent);
    opacity: 0; transition: opacity .6s;
  }
  .horizon svg { width: 100%; height: 100%; display: block; }
  body.evening .horizon { opacity: .4; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* header */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 0 22px; }
  .eyebrow { font-family: var(--retro); font-size: 10.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  /* scales down a touch on narrow phones so "Good afternoon" stays on one line next to the two buttons */
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 8.6vw, 36px); line-height: 1.1; letter-spacing: -0.02em; margin: 8px 0 0; }
  body.evening h1 { text-shadow: 0 0 28px rgba(255,94,168,.35); }
  .mode {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex-shrink: 0; margin-top: 6px;
  }
  .mode svg { width: 19px; height: 19px; }

  /* video card */
  .player {
    position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: #000;
    box-shadow: 0 20px 44px -18px var(--shadow), 0 2px 6px rgba(0,0,0,.08);
  }
  body.evening .player { box-shadow: 0 20px 54px -16px var(--shadow), 0 0 0 1px var(--line); }
  .player iframe, #yt { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* The poster sits on top but lets taps fall through to YouTube's player, so iOS plays it natively. */
  .poster { position: absolute; inset: 0; pointer-events: none; transition: opacity .35s; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.45)); }
  .poster .play {
    position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px; border-radius: 50%;
    background: rgba(255,255,255,.88); display: grid; place-items: center; z-index: 1;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .poster .play svg { width: 26px; height: 26px; margin-left: 4px; fill: #2b2620; }
  .poster .len {
    position: absolute; right: 12px; bottom: 12px; z-index: 1; font-size: 12px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,.45); padding: 4px 9px; border-radius: 999px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .poster.hidden { opacity: 0; }
  .player.swap { animation: swap .45s ease; }
  @keyframes swap { 0% { opacity: .2; transform: scale(.97); } 100% { opacity: 1; transform: none; } }
  /* Invisible shields over YouTube's title bar and bottom row (share, "More videos", logo), so a stray tap can't wander off to YouTube. */
  .shield { position: absolute; z-index: 2; display: none; }
  .player.playing .shield { display: block; }
  .shield.top { left: 0; right: 0; top: 0; height: 22%; }
  .shield.bottom { left: 0; right: 0; bottom: 0; height: 50px; }
  .player.big .shield.bottom { height: 66px; }   /* full-screen layout puts the "More videos" tile a little higher */
  /* In the last stretch, YouTube shows clickable "watch next" tiles; the whole player is shielded then. */
  .player.endzone .shield.top { height: 100%; }
  /* Big mode: while a video plays it fills the screen. Our shields and cover come along because they live inside .player. */
  .player.big { position: fixed; inset: 0; z-index: 15; width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  body.theater { overflow: hidden; }
  .size-btn {
    position: absolute; z-index: 4; right: calc(env(safe-area-inset-right) + 12px); top: calc(env(safe-area-inset-top) + 12px);
    width: 44px; height: 44px; border-radius: 14px; display: none; place-items: center; color: #fff;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .player:not(.big) .size-btn { top: 12px; right: 12px; }
  .player.playing .size-btn { display: grid; }
  .size-btn svg { width: 22px; height: 22px; }
  .size-btn:active { transform: scale(.94); }
  /* Sound stays off until the routine itself starts, so pre-roll ads play silently. */
  .hush {
    position: absolute; z-index: 4; left: calc(env(safe-area-inset-left) + 12px); top: calc(env(safe-area-inset-top) + 12px); display: none; pointer-events: none;
    font-size: 12px; font-weight: 600; color: #fff; padding: 6px 11px; border-radius: 999px;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .player:not(.big) .hush { top: 12px; left: 12px; }
  .player.playing.hushed .hush { display: block; }
  /* Pausing covers YouTube's "More videos" shelf with our own Keep going button. */
  .paused { position: absolute; inset: 0; z-index: 3; display: none; place-items: center; background: rgba(0,0,0,.55); }
  .paused.show { display: grid; animation: swap .3s ease; }
  .paused button {
    display: flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 999px;
    background: rgba(255,255,255,.9); color: #2b2620; font-weight: 600; font-size: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .paused button svg { width: 16px; height: 16px; fill: currentColor; }

  /* meta */
  .meta { padding: 18px 2px 0; }
  .channel { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .title { font-family: var(--serif); font-size: 23px; line-height: 1.2; letter-spacing: -0.01em; margin-top: 5px; }
  .links { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .thumb {
    width: 44px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--muted); transition: transform .15s, background .2s, color .2s;
  }
  .thumb svg { width: 19px; height: 19px; }
  .thumb:active { transform: scale(.92); }
  .thumb.on { background: var(--sunset); border-color: transparent; color: var(--accent-fg); }
  .thumb.on svg path { fill: currentColor; }

  /* week */
  .week {
    margin-top: auto; padding: 16px 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .week-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .week-head .label { font-family: var(--retro); color: var(--muted); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: 10px; }
  .week-head .streak { color: var(--fg); font-weight: 500; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; text-align: center; }
  .day { font-size: 11px; color: var(--muted); }
  .dot {
    width: 30px; height: 30px; margin: 6px auto 0; border-radius: 50%; background: var(--faint);
    display: grid; place-items: center; transition: background .4s, transform .4s;
  }
  .dot svg { width: 14px; height: 14px; stroke: var(--accent-fg); opacity: 0; }
  .day.today .dot { box-shadow: inset 0 0 0 1.5px var(--soft); }
  .day.today { color: var(--fg); font-weight: 600; }
  /* plain fill = finished before morning/evening was tracked */
  .day.done .dot { background: var(--muted); box-shadow: 0 4px 12px -4px var(--shadow); }
  .day.done .dot svg { opacity: 1; }
  .day.done.am .dot { background: var(--am); }
  .day.done.pm .dot { background: var(--pm); }
  .day.done.am.pm .dot { background: var(--ampm); }
  .day.pop .dot { animation: pop .6s ease; }
  @keyframes pop { 40% { transform: scale(1.25); } }

  .spacer { min-height: 20px; flex: 0 0 20px; }
  /* YouTube-app mode: a real link over the card, so iOS hands it to the YouTube app */
  .applink { position: absolute; inset: 0; z-index: 2; display: none; }
  body.app-mode .applink { display: block; }

  /* "Finished?" check-in after coming back from the YouTube app */
  .finish {
    display: none; margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); align-items: center; gap: 12px;
  }
  .finish.show { display: flex; animation: swap .4s ease; }
  .finish .q { flex: 1; font-size: 15px; line-height: 1.3; }
  .finish .q small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .finish button { font-size: 14px; font-weight: 500; padding: 9px 12px; border-radius: 12px; color: var(--muted); }
  .finish .yes { background: var(--soft); color: #fff; }

  /* settings row */
  /* lifetime totals under the week strip */
  .totals { display: block; margin: 12px auto 0; text-align: center; font-size: 12px; color: var(--muted); }
  .totals:empty { display: none; }
  .totals:not(:empty)::after { content: " ›"; }   /* opens the month calendar */
  /* month calendar: the week dots, a month at a time, with the date inside */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 4px; }
  .cal-head b { font-family: var(--serif); font-weight: 400; font-size: 20px; }
  .cal-nav { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); background: var(--card); border: 1px solid var(--line); }
  .cal-nav:disabled { opacity: .25; }
  .cal-nav svg { width: 18px; height: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 6px; text-align: center; touch-action: pan-y; }
  .cal .dot { width: 36px; height: 36px; margin: 4px auto 0; font-size: 13px; color: var(--fg); }
  .cal .day.done .dot { color: #fff; font-weight: 600; }
  .cal .day.later .dot { background: none; color: var(--muted); opacity: .5; }
  .cal-sum { margin: 14px 0 0; text-align: center; font-size: 14px; color: var(--fg); min-height: 1.4em; }
  .cal-key { display: flex; justify-content: center; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .cal-key span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-key i { width: 10px; height: 10px; border-radius: 50%; }
  /* stats at the top of Your history */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 2px 0 6px; }
  .stat { padding: 11px 12px; border-radius: 14px; background: var(--faint); }
  .stat b { display: block; font-family: var(--serif); font-weight: 400; font-size: 21px; line-height: 1.15; white-space: nowrap; }
  .stat span { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .note { margin: 6px 0 14px; font-size: 12px; color: var(--muted); }
  /* badges: earned ones in the sunset gradient, the rest waiting with their progress */
  .sheet h3 { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 12px; font-family: var(--serif); font-weight: 400; font-size: 20px; }
  .sheet h3 small { font-family: -apple-system, system-ui, sans-serif; font-size: 12.5px; color: var(--muted); }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; text-align: center; }
  .badge i { width: 52px; height: 52px; margin: 0 auto 7px; border-radius: 50%; display: grid; place-items: center; background: var(--faint); color: var(--muted); }
  .badge i svg { width: 24px; height: 24px; }
  .badge.got i { background: var(--sunset); color: #fff; box-shadow: 0 6px 16px -6px var(--shadow); }
  .badge:not(.got) i { opacity: .55; }
  .badge b { display: block; font-size: 13px; font-weight: 600; line-height: 1.25; }
  .badge:not(.got) b { color: var(--muted); font-weight: 500; }
  .badge span { display: block; margin-top: 2px; font-size: 11.5px; line-height: 1.3; color: var(--muted); }
  /* sign-in line above the version, and the sheet it opens */
  .acct { display: block; margin: 14px auto 0; font-size: 12.5px; color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .acct[hidden] { display: none; }
  .acct-btns { display: grid; gap: 10px; margin-top: 4px; }
  .acct-btns[hidden] { display: none; }
  .acct-btns button { height: 50px; border-radius: 16px; font-weight: 500; font-size: 16px; border: 1px solid var(--line); background: var(--card); }
  .acct-btns .primary { background: var(--soft); border-color: transparent; color: #fff; }
  .acct-btns button:disabled { opacity: .5; }
  .acct-msg { min-height: 1.4em; margin: 12px 0 0; font-size: 13.5px; color: var(--accent); text-align: center; }
  .version { margin-top: 10px; text-align: center; font-size: 11px; letter-spacing: .04em; color: var(--muted); opacity: .7; }
  .pref { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .switch { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--faint); border: 1px solid var(--line); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .switch:checked { background: var(--soft); border-color: transparent; }
  .switch:checked::after { transform: translateX(16px); }
  .next {
    width: 100%; height: 54px; border-radius: 18px; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-weight: 500; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 12px; transition: transform .12s;
  }
  .next:active, .mode:active { transform: scale(.97); }
  .next svg { width: 18px; height: 18px; color: var(--soft); }

  .toast {
    position: fixed; z-index: 20; left: 50%; top: calc(env(safe-area-inset-top) + 14px); transform: translate(-50%, -8px);
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap;
    display: flex; align-items: center; gap: 12px;
  }
  .toast.show.has-undo { pointer-events: auto; }
  .toast button { font-weight: 700; color: #d6337f; }
  body:not(.evening) .toast button { color: #ffc76a; }
  .toast.show { opacity: .95; transform: translate(-50%, 0); }

  /* favorites: everything you've given a thumbs up */
  .actions { display: flex; gap: 10px; flex-shrink: 0; }
  .sheet-wrap { position: fixed; inset: 0; z-index: 20; display: none; }
  .sheet-wrap.show { display: block; }
  .scrim { position: absolute; inset: 0; background: rgba(30,12,30,.35); animation: fade .25s ease; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 80dvh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg); border-radius: 26px 26px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px);
    box-shadow: 0 -12px 40px -12px var(--shadow); animation: rise .32s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .sheet-head h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; letter-spacing: -0.01em; margin: 4px 0 0; }
  .sheet-head .sub { font-size: 13.5px; line-height: 1.4; color: var(--muted); margin: 4px 0 0; padding-right: 8px; }
  .sheet-head .mode { margin-top: 0; }
  .fav { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); transition: opacity .2s; }
  .fav:first-child { border-top: 0; }
  .fav.off { opacity: .45; }
  .fav .go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
  .fav .go > div { flex: 1; min-width: 0; }
  .fav img { width: 96px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; flex-shrink: 0; background: var(--faint); }
  .fav .t { font-family: var(--serif); font-size: 16px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fav .s { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav .thumb { flex-shrink: 0; width: 40px; height: 36px; }
  .fav-empty { color: var(--muted); font-size: 15px; padding: 18px 0 8px; line-height: 1.5; }
  body.sheet-open { overflow: hidden; }
  /* Pull-to-refresh: home-screen apps on iPhone don't get Safari's, so we draw our own. Tucked above the top edge until you pull. */
  .pull {
    position: fixed; z-index: 20; left: 50%; top: calc(env(safe-area-inset-top) - 44px); width: 38px; height: 38px; margin-left: -19px; border-radius: 50%;
    display: grid; place-items: center; background: var(--bg); color: var(--muted); box-shadow: 0 6px 18px -6px var(--shadow), 0 0 0 1px var(--line);
    opacity: 0; pointer-events: none; transition: transform .25s, opacity .25s, color .2s;
  }
  .pull.pulling { transition: color .2s; }
  .pull.ready { color: var(--accent); }
  .pull svg { width: 18px; height: 18px; }
  .pull.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; }
  @media (min-width: 600px) {
    body { max-width: 520px; margin: 0 auto; }
    /* sheets cover the whole window, so keep their panel in the same column as the app */
    .sheet { max-width: 520px; margin: 0 auto; }
  }
</style>
</head>
<body>

"100" vector-effect="non-scaling-stroke"/><line x1="58.10" y1="0" x2="194.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="59.00" y1="0" x2="210.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="59.90" y1="0" x2="226.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="60.80" y1="0" x2="242.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="61.70" y1="0" x2="258.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="62.60" y1="0" x2="274.00" y2="100" vector-effect="non-scaling-stroke"/><line x1="-50" y1="0.00" x2="150" y2="0.00" vector-effect="non-scaling-stroke"/><line x1="-50" y1="1.92" x2="150" y2="1.92" vector-effect="non-scaling-stroke"/><line x1="-50" y1="7.18" x2="150" y2="7.18" vector-effect="non-scaling-stroke"/><line x1="-50" y1="15.51" x2="150" y2="15.51" vector-effect="non-scaling-stroke"/><line x1="-50" y1="26.79" x2="150" y2="26.79" vector-effect="non-scaling-stroke"/><line x1="-50" y1="40.94" x2="150" y2="40.94" vector-effect="non-scaling-stroke"/><line x1="-50" y1="57.89" x2="150" y2="57.89" vector-effect="non-scaling-stroke"/><line x1="-50" y1="77.59" x2="150" y2="77.59" vector-effect="non-scaling-stroke"/><line x1="-50" y1="100.00" x2="150" y2="100.00" vector-effect="non-scaling-stroke"/></g></svg></div>

<script src="videos.js"></script>
<script>
  // ---- storage (safe if localStorage is unavailable) ----
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const blocked = new Set(store.get("blocked", []));   // thumbs down + unembeddable
  const liked = new Set(store.get("liked", []));       // thumbs up
  const lastShown = store.get("lastShown", {});         // id -> timestamp
  const current = store.get("current", {});            // mode -> {id, at}
  const doneDays = new Set(store.get("doneDays", []));  // "YYYY-MM-DD" days you finished a routine
  const sessions = store.get("sessions", {});           // "YYYY-MM-DD" -> ["morning", "evening"]: which ones
  const time = store.get("time", {});                   // "YYYY-MM-DD" -> {videoId: seconds}: each routine finished, by its length
  let appMode = store.get("appMode", false);             // play in the YouTube app (ad-free with Premium)
  // Each thumbs up/down also notes when it happened, so signed-in devices can merge them (newest wins).
  // Likes from before this existed get tiny times, in order, so any real change beats them.
  const seedMarks = (set) => Object.fromEntries([...set].map((id, i) => [id, [1, i + 1]]));
  const marks = store.get("marks", null) || { liked: seedMarks(liked), blocked: seedMarks(blocked) };
  function setLiked(id, on) {
    on ? liked.add(id) : liked.delete(id); marks.liked[id] = [on ? 1 : 0, Date.now()];
    store.set("liked", [...liked]); store.set("marks", marks); queueSync();
  }
  function setBlocked(id, on) {
    on ? blocked.add(id) : blocked.delete(id); marks.blocked[id] = [on ? 1 : 0, Date.now()];
    store.set("blocked", [...blocked]); store.set("marks", marks); queueSync();
  }

  const autoMode = () => { const h = new Date().getHours(); return (h >= 18 || h < 4) ? "evening" : "morning"; };
  let mode = autoMode();
  let lastAuto = mode;   // a manual switch sticks until the clock crosses 6pm / 4am
  let video = null, videoMode = mode, player = null, ready = false, progressTimer = null;
  let reached = false, celebrated = false;   // this video: past 80% / confetti already popped
  let autoBig = false, hushed = false;       // this video: already went big once / sound held off for an ad

  const $ = (id) => document.getElementById(id);
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  function applyMode() {
    document.body.classList.toggle("evening", mode === "evening");
    const h = new Date().getHours();
    $("greeting").textContent = mode === "evening" ? "Wind down" : h >= 18 || h < 4 ? "Good evening" : h >= 12 ? "Good afternoon" : "Good morning";
    $("mode").innerHTML = mode === "evening" ? SUN : MOON;
    $("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    document.querySelector('meta[name="theme-color"]').content = mode === "evening" ? "#12082e" : "#ffe6a8";
  }

  // ---- week strip + streak ----
  function renderWeek(popToday) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    $("days").innerHTML = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const k = dayKey(d), isToday = k === dayKey(today);
      const el = document.createElement("div");
      const s = sessions[k] || [];   // days from before this was tracked just get the plain fill
      el.className = "day" + (doneDays.has(k) ? " done" : "") + (s.includes("morning") ? " am" : "") + (s.includes("evening") ? " pm" : "")
                   + (isToday ? " today" : "") + (isToday && popToday ? " pop" : "");
      el.setAttribute("aria-label", s.length ? s.join(" and ") + " done" : doneDays.has(k) ? "done" : "not done");
      el.innerHTML = `${"MTWTFSS"[i]}<div class="dot">${CHECK}</div>`;
      $("days").appendChild(el);
    }
    const streak = currentStreak();
    const both = (sessions[dayKey(today)] || []).length === 2;
    $("streak").textContent = streak > 1 ? `${streak}-day streak` : both ? "Morning + evening ✓" : doneDays.has(dayKey(today)) ? "Done today ✓" : "";

    $("totals").textContent = totalsText([...doneDays], true);
  }

  function currentStreak() {
    let streak = 0; const d = new Date(); d.setHours(0, 0, 0, 0);
    if (!doneDays.has(dayKey(d))) d.setDate(d.getDate() - 1);   // today not done yet doesn't break the streak
    while (doneDays.has(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  // "12 sessions · 2 h 15 min · best streak 5 days" for a set of days. Morning and evening count as separate sessions;
  // time only counts routines finished since it started being recorded.
  const sessionsOn = (k) => Math.max(1, (sessions[k] || []).length);
  const secondsOn = (k) => Object.values(time[k] || {}).reduce((a, b) => a + b, 0);
  function hm(sec) { const m = Math.round(sec / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h` + (m % 60 ? ` ${m % 60} min` : ""); }
  function bestStreak(days) {
    let best = 0, run = 0, prev = null;
    for (const k of [...days].sort()) {
      const t = new Date(k + "T12:00").getTime();
      run = prev !== null && Math.round((t - prev) / 864e5) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = t;
    }
    return best;
  }
  function totalsText(days, withStreak) {
    days = days.sort();
    const n = days.reduce((t, k) => t + sessionsOn(k), 0), sec = days.reduce((t, k) => t + secondsOn(k), 0);
    if (!n) return "";
    const best = bestStreak(days);
    return [`${n} ${n === 1 ? "session" : "sessions"}`, sec >= 60 && hm(sec), withStreak && best > 1 && `best streak ${best} days`].filter(Boolean).join(" · ");
  }

  // m: which routine was finished, so the day's dot can show morning, evening, or both.
  // id: which video, so its length adds to the time total (once per video per day).
  const lengthOf = (id) => { const v = [...VIDEOS.morning, ...VIDEOS.evening].find(x => x[0] === id); return v ? secs(v[3]) : 0; };
  function saveToday(m = videoMode, id = video && video[0]) {
    const k = dayKey(new Date()), s = sessions[k] || [], len = lengthOf(id);
    const newTime = len > 0 && !(time[k] && time[k][id]);
    if (newTime) { time[k] = { ...time[k], [id]: len }; store.set("time", time); }
    if (doneDays.has(k) && s.includes(m)) { if (newTime) { renderWeek(); queueSync(); } return; }
    doneDays.add(k); store.set("doneDays", [...doneDays]);
    if (!s.includes(m)) { sessions[k] = [...s, m]; store.set("sessions", sessions); }
    renderWeek(); queueSync();
  }

  // A video was completed: count the day and celebrate, once per video.
  function markDone(m = videoMode, id = video && video[0]) {
    saveToday(m, id);
    if (celebrated) return;
    celebrated = true;
    renderWeek(true); confetti();
    toast(mode === "evening" ? "Nicely done. Sleep well." : "Nice work. Have a good day.");
    // Any badge this finished routine earned gets its own moment, right after.
    const fresh = BADGES.filter(b => b.test(stats()) && !earned.has(b.id));
    fresh.forEach(b => earned.add(b.id));
    if (fresh.length) setTimeout(() => toast(`Badge unlocked: ${fresh.map(b => b.name).join(", ")}`, openHist, "View"), 2600);
  }

  // ---- confetti, in the icon's sunrise / synthwave colors ----
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = mode === "evening" ? ["#ffb347", "#ff5e7e", "#ff3ea5", "#b58cff", "#f5ecff"]
                                      : ["#ffc76a", "#ff9a5c", "#e0773a", "#ff8fa3", "#fff4d6"];
    const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    const ctx = c.getContext("2d"); ctx.scale(dpr, dpr);
    // two bursts from the lower corners, angled up toward the middle
    const bits = Array.from({ length: 140 }, (_, i) => {
      const left = i % 2 === 0, a = (left ? -60 : -120) + (Math.random() - 0.5) * 50, sp = 9 + Math.random() * 9;
      return { x: left ? 0 : W, y: H * 0.8, vx: Math.cos(a * Math.PI / 180) * sp, vy: Math.sin(a * Math.PI / 180) * sp,
               w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
               color: colors[i % colors.length], round: Math.random() < 0.3 };
    });
    const start = performance.now();
    (function frame(now) {
      const t = now - start;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = Math.max(0, Math.min(1, (3200 - t) / 800));   // fade out over the last 0.8s
      for (const b of bits) {
        b.vx *= 0.985; b.vy = b.vy * 0.985 + 0.28; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.color;
        ctx.scale(1, Math.cos(t / 120 + b.r));   // flutter
        if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.h / 2 + 1, 0, 7); ctx.fill(); } else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      if (t < 3200) requestAnimationFrame(frame); else c.remove();
    })(start);
  }

  // Least-recently-shown first, random among ties, so you cycle the whole list before repeats.
  // Thumbs-up videos jump the queue ~40% of the time once they haven't been shown for 3 days.
  function pick(excludeId) {
    const pool = VIDEOS[mode].filter(v => !blocked.has(v[0]) && v[0] !== excludeId);
    if (!pool.length) return null;
    const fav = pool.filter(v => liked.has(v[0]) && Date.now() - (lastShown[v[0]] || 0) > 3 * 864e5);
    if (fav.length && Math.random() < 0.4) return fav[Math.floor(Math.random() * fav.length)];
    pool.sort(() => Math.random() - 0.5);
    pool.sort((a, b) => (lastShown[a[0]] || 0) - (lastShown[b[0]] || 0));
    return pool[0];
  }

  function show(v, animate) {
    video = v; videoMode = mode; reached = celebrated = false;
    if (!v) {
      $("channel").textContent = ""; $("title").textContent = "You've thumbed-down everything here.";
      toast("Bring them all back?", () => { VIDEOS[mode].forEach(x => blocked.has(x[0]) && setBlocked(x[0], false)); show(pick(), true); }, "Restore");
      return;
    }
    lastShown[v[0]] = Date.now(); store.set("lastShown", lastShown);
    current[mode] = { id: v[0], at: Date.now() }; store.set("current", current);
    $("channel").textContent = v[2];
    $("up").classList.toggle("on", liked.has(v[0]));
    $("title").textContent = v[1];
    $("len").textContent = v[3];
    $("applink").href = `https://www.youtube.com/watch?v=${v[0]}`;
    const img = $("thumb");

    const cred = await navigator.credentials.create({ publicKey: { ...o, challenge: b64u.from(o.challenge), user: { ...o.user, id: b64u.from(o.user.id) }, excludeCredentials: ids(o.excludeCredentials) } });
    const r = cred.response;
    return api("/register/finish", { id, response: asJSON(cred, { clientDataJSON: b64u.to(r.clientDataJSON), attestationObject: b64u.to(r.attestationObject), transports: r.getTransports ? r.getTransports() : [] }) });
  }
  async function usePasskey() {
    const { id, options: o } = await ahead.login;
    const cred = await navigator.credentials.get({ publicKey: { ...o, challenge: b64u.from(o.challenge), allowCredentials: ids(o.allowCredentials) } });
    const r = cred.response;
    return api("/login/finish", { id, response: asJSON(cred, { clientDataJSON: b64u.to(r.clientDataJSON), authenticatorData: b64u.to(r.authenticatorData),
      signature: b64u.to(r.signature), userHandle: r.userHandle ? b64u.to(r.userHandle) : undefined }) });
  }
  async function signIn(how) {
    document.querySelectorAll("#acct-out button").forEach(b => b.disabled = true); $("acct-msg").textContent = "";
    try {
      const { token } = await how();
      syncToken = token; store.set("syncToken", token);
      await sync();   // this device's history goes up, everything else comes down
      BADGES.filter(b => b.test(stats())).forEach(b => earned.add(b.id));
      closeAcct(); paintAcct(); toast("Signed in. Your history is saved.");
    } catch (e) {
      // Cancelling the Face ID prompt isn't an error worth a message.
      $("acct-msg").textContent = e.name === "NotAllowedError" || e.name === "AbortError" ? "" : e.message;
      prefetch();   // each attempt needs a fresh challenge
    } finally { document.querySelectorAll("#acct-out button").forEach(b => b.disabled = false); }
  }

  function paintAcct() {
    $("acct").hidden = !canSync;
    $("acct").textContent = syncToken ? "Signed in · history saved" : "Sign in to keep your history";
  }
  function openAcct() {
    const on = !!syncToken;
    $("acct-title").textContent = on ? "You're signed in" : "Keep your history";
    $("acct-sub").textContent = on ? "Your finished days, favorites and thumbs-downs are saved, and follow you to any device where you sign in with your passkey."
      : "Sign in with Face ID. No password or email. Your finished days, favorites and thumbs-downs follow you to any device, even if you delete the app.";
    $("acct-out").hidden = on; $("acct-in").hidden = !on; $("acct-msg").textContent = "";
    if (!on) prefetch();
    $("acct-sheet").classList.add("show"); lockForSheets();
  }
  function closeAcct() { $("acct-sheet").classList.remove("show"); lockForSheets(); }
  $("acct").onclick = openAcct;
  $("acct-close").onclick = $("acct-scrim").onclick = closeAcct;
  $("acct-new").onclick = () => signIn(createPasskey);
  $("acct-old").onclick = () => signIn(usePasskey);
  $("acct-signout").onclick = async () => {
    try { await api("/logout"); } catch {}
    syncToken = null; store.set("syncToken", null); closeAcct(); paintAcct(); toast("Signed out. Your history stays on this device too.");
  };

  applyMode();
  renderWeek();
  paintAcct(); sync();
  show(initial());
  checkFinished();   // the app may have been fully closed while you were in YouTube

  // ---- YouTube player ----
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("yt", {
      videoId: video ? video[0] : undefined,
      // Plays inside the app, not iOS's own full screen, so our shields and cover stay on top of YouTube's player.
      // Big mode stands in for full screen.
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, fs: 0, iv_load_policy: 3, disablekb: 1 },
      events: {
        onReady: () => { ready = true; hush(); },
        onStateChange: (e) => {
          const S = YT.PlayerState, c = $("card");
          if (e.data === S.PLAYING || e.data === S.BUFFERING) {
            $("poster").classList.add("hidden"); c.classList.add("playing"); $("paused").classList.remove("show");
            if (!autoBig) { autoBig = true; setBig(true); }
          }
          if (e.data === S.PAUSED) $("paused").classList.add("show");
          // Finishing, or stopping after ~80%, counts as complete. The confetti waits until then
          // so it doesn't pop mid-routine.
          if (e.data === S.ENDED || (e.data === S.PAUSED && reached)) markDone();
          // At the end, step back out of big mode and reset the card, so YouTube's end screen of other videos never shows.
          if (e.data === S.ENDED) show(video);
          clearInterval(progressTimer);
          if (e.data === S.PLAYING) progressTimer = setInterval(() => {
            const dur = player.getDuration(), now = player.getCurrentTime();
            if (!dur) return;
            if (now / dur >= 0.8 && !reached) { reached = true; saveToday(); }
            const want = video ? secs(video[3]) : dur;
            if (hushed && now >= 1 && (Math.abs(dur - want) <= Math.max(4, want * 0.06) || now >= 15)) unhush();
            c.classList.toggle("endzone", dur - now <= 22);
          }, 1000);
        },
        // 100 = removed, 101/150 = owner disabled embedding. Hide it and move on.
        onError: (e) => { if ([100, 101, 150].includes(e.data) && video) { setBlocked(video[0], true); next(); } },
      },
    });
  };
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
