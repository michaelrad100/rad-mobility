name: Find fresh mobility videos
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: refill-videos
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/find-videos.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ISSUE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-refill-report
          path: content-refill-report.md
          if-no-files-found: ignore
